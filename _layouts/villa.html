<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }}</title>
    <style>
      :root {
        --cream: #fbf6ed;
        --ink: #251d17;
        --muted: #776557;
        --coffee: #6f3f24;
        --gold: #c9833d;
        --line: rgba(111, 63, 36, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        font-family: Arial, "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(rgba(251, 246, 237, 0.9), rgba(251, 246, 237, 0.98)),
          url("{{ page.photo }}") center / cover fixed;
      }

      .page {
        width: min(100%, 460px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 16px 24px;
        display: flex;
        flex-direction: column;
      }

      .villa-name {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto 18px;
        padding: 9px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.9);
        color: var(--coffee);
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 10px 26px rgba(70, 36, 16, 0.1);
      }

      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .logo {
        width: clamp(190px, 58vw, 280px);
        height: clamp(190px, 58vw, 280px);
        padding: 12px;
        object-fit: contain;
        border: 4px solid rgba(111, 63, 36, 0.2);
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 18px 42px rgba(70, 36, 16, 0.18);
      }

      .cafe {
        margin: 0;
        color: var(--coffee);
        font-size: clamp(1.65rem, 8vw, 2.45rem);
        line-height: 1.05;
        font-weight: 900;
        text-align: center;
      }

      .caption {
        margin: -8px 0 4px;
        color: var(--muted);
        font-size: 0.98rem;
        font-weight: 700;
        text-align: center;
      }

      .photo {
        width: 100%;
        aspect-ratio: 4 / 5;
        border: 1px solid var(--line);
        border-radius: 8px;
        object-fit: cover;
        box-shadow: 0 18px 42px rgba(70, 36, 16, 0.2);
      }

      .order-button {
        width: 100%;
        min-height: 58px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--coffee), var(--gold));
        color: #fff;
        font-size: 1.05rem;
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 16px 30px rgba(111, 63, 36, 0.28);
      }

      .order-button:active {
        transform: translateY(1px);
      }

      .footnote {
        margin: 12px 0 0;
        color: rgba(37, 29, 23, 0.58);
        font-size: 0.78rem;
        font-weight: 700;
        text-align: center;
      }

      @media (min-width: 760px) {
        .page {
          width: min(100%, 540px);
          padding-top: 26px;
        }

        .photo {
          aspect-ratio: 16 / 10;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="villa-name">{{ page.villa_name }}</div>

      <section class="hero" aria-label="{{ page.cafe_name }}">
        <img class="logo" src="{{ page.logo }}" alt="{{ page.cafe_name }}" />
        <h1 class="cafe">{{ page.cafe_name }}</h1>
        <p class="caption">{{ page.caption }}</p>
        <img class="photo" src="{{ page.photo }}" alt="{{ page.photo_alt }}" />
        <a class="order-button" href="{{ page.target }}">Παραγγείλτε εδώ</a>
      </section>

      <p class="footnote">Powered by {{ page.cafe_name }}</p>
    </main>
  </body>
</html>
